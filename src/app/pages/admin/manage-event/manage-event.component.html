<div class="manage-container">
    <div class="manage-card" *ngIf="event()">
        <header class="manage-header">
            <button class="back-btn" (click)="goBack()">← Back</button>
            <div class="header-info">
                <h2>Manage Event</h2>
                <div class="plan-selector">
                    <select [value]="event()?.planType || 'basic'" (change)="onPlanChange($event)" class="plan-badge"
                        [class]="event()?.planType || 'basic'">
                        <option *ngFor="let option of currentPlanOptions" [value]="option.key">
                            {{ option.label | uppercase }}
                        </option>
                    </select>
                </div>
            </div>
            <h1 class="event-title">{{ event()?.title }}</h1>
        </header>

        <div class="progress-section">
            <div class="progress-header">
                <span>Progress</span>
                <span class="percentage">{{ calculateProgress() }}%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" [style.width.%]="calculateProgress()"></div>
            </div>
        </div>

        <div class="checklist-container">
            <h3>Event Checklist</h3>
            <div class="checklist-items" cdkDropList (cdkDropListDropped)="drop($event)">
                <div class="checklist-item" *ngFor="let item of checklist(); let i = index" cdkDrag
                    [class.completed]="item.completed">
                    <div class="drag-handle" cdkDragHandle>
                        <span class="grip-lines">⋮⋮</span>
                    </div>
                    <div class="checkbox" (click)="toggleItem(i)">
                        <span *ngIf="item.completed">✓</span>
                    </div>
                    <span class="label">{{ item.label }}</span>
                    <div class="note-wrapper" (click)="$event.stopPropagation()">
                        <div class="note-display">
                            <span class="note-content" [class.scrolling]="item.note">
                                {{ item.note || 'Add note...' }}
                            </span>
                        </div>
                        <div class="note-popup">
                            <textarea [(ngModel)]="item.note" placeholder="Enter full note here..."></textarea>
                        </div>
                    </div>
                </div>
            </div>
            <input class="add-task-input" placeholder="+ Add New Task" [(ngModel)]="newTaskName"
                (keydown.enter)="addTask()">
        </div>

        <div class="staff-container">
            <h3>Assigned Staff</h3>
            <div class="staff-list">
                <div class="staff-item" *ngFor="let member of staff(); let i = index">
                    <div class="staff-info">
                        <span class="staff-name">{{ member.name }}</span>
                        <span class="staff-role">{{ member.role }}</span>
                    </div>
                    <button class="remove-btn" (click)="removeStaff(i)" title="Remove Staff">×</button>
                </div>
            </div>

            <div class="add-staff-form">
                <input type="text" placeholder="Name" [(ngModel)]="newStaffName">
                <input type="text" placeholder="Role (e.g. Photographer)" [(ngModel)]="newStaffRole"
                    (keydown.enter)="addStaff()">
                <button (click)="addStaff()" [disabled]="!newStaffName || !newStaffRole">+</button>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-save" (click)="saveProgress()">Save Progress</button>
        </div>
    </div>
</div>
